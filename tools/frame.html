<!doctype html><html><head><meta charset="utf-8"><style>
html,body{margin:0;width:540px;height:960px;background:#0F1417;font-family:Inter,sans-serif;color:#EEF3F1;overflow:hidden}
#f{position:relative;width:540px;height:960px;background:radial-gradient(110% 60% at 50% 35%, var(--accd) 0%, #0F1417 70%)}
.hd{position:absolute;top:78px;left:24px;right:24px}
.lv{display:inline-block;padding:4px 12px;border-radius:99px;background:var(--acc);color:#0F1417;font-weight:800;font-size:14px;letter-spacing:.06em;text-transform:uppercase}
.ft{font-size:15px;color:#8FA0A4;margin-left:8px}
.ch{margin-top:12px;font:800 25px/1.15 "Inter Display",Inter,sans-serif;letter-spacing:-.01em}
.ch b{color:var(--acc)}
.sci{display:inline-block;margin-top:10px;padding:4px 12px;border-radius:8px;border:2px solid var(--acc);color:var(--acc);font-weight:800;font-size:14px;letter-spacing:.1em}
svg{position:absolute;left:20px;top:200px;width:500px;height:520px;font-family:Inter,sans-serif}
</style></head><body><div id="f"><div class="hd"><span class="lv" id="lv"></span><span class="ft" id="ft"></span><div class="ch" id="ch"></div><div id="sc"></div></div><div id="art"></div></div>
<script src="draw.js"></script><script src="films.js"></script><script>
const LVN={seconde:'Seconde',premiere:'Première',terminale:'Terminale'};
function show(fi,ci,qi){const f=FILMS[fi],c=f.clips[ci],q=c.cues[qi],a=ACC[f.level];
 document.documentElement.style.setProperty('--acc',a);document.documentElement.style.setProperty('--accd',a+'2E');
 lv.textContent=LVN[f.level];ft.textContent=f.title;ch.innerHTML=`<b>${c.n} ·</b> ${c.title}`;
 sc.innerHTML=q.sci?'<span class="sci">EN SCIENCE</span>':'';
 art.innerHTML=S(q.sci?card(q.rows,a,30):q.draw(a));}
window.META=FILMS.map(f=>({id:f.id,level:f.level,title:f.title,clips:f.clips.map(c=>({n:c.n,title:c.title,cues:c.cues.map(q=>({say:q.say,sci:!!q.sci}))}))}));
</script></body></html>
